<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- nav-bar -->
    <header class="head-items">
        <section class="nav-section">

         <article class="nav-items">
    

         <!-- switch icons  -->

        <div class="close-hamburger">
          <figure class="hamburger">
              <img src="./images/icon-menu.svg" alt="">
          </figure>

          <figure class="close">
            <img src="./images/icon-close.svg" alt="">
          </figure>
        </div>
            

        <div class="nav-icons">
       <figure class="logo">
                <img src="./images/logo.svg" alt="">
        </figure>
        </div>

        <!-- nav-links -->
        <nav class="nav-list">
            <ul class="list">
                <li><a href="#">Collections</a></li>
                <li><a href="#">Men</a></li>
                <li><a href="#">Women</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>

        <div class="nav-images">
            <!-- cart image -->

            
        <figure class="cart-icon">
          <img src="./images/icon-cart.svg" alt="">
        </figure>
        <!-- avatar  -->
        <figure class="avatar">
           <img src="./images/image-avatar.png" alt="">
        </figure>
        
        </div>

         </article>

        </section>
    </header>

    <!-- main section  -->
    <main class="main-items">
        <section class="sneaker-section">
            <!-- body items  -->
        <article class="sneaker-body">
            <!-- previous and next arrow  -->
        <div class="arrows">
            <!-- arrow previous  -->
            <figure class="arrow-left">
            <img src="./images/icon-previous.svg" alt="">
            </figure>
            <!-- arrow next  -->
            <figure class="arrow-right">
            <img src="./images/icon-next.svg" alt="">
            </figure>
        </div>

        <!-- several sneakers  -->

        <article class="five-sneakers">
            <div class="first-kicks">
            <figure class="first">
            <img src="./images/image-product-1.jpg" alt="">
            </figure>
            </div>
             <!-- ground sneakers  -->
            <div class="kicks">
            <figure class="second">
             <img src="./images/image-product-2.jpg" alt="">
            </figure>
            
            <figure class="third">
            <img src="./images/image-product-3.jpg" alt="">    
            </figure>

            <figure class="fourth">
            <img src="./images/image-product-4.jpg" alt="">    
            </figure>

            <figure class="fifth">
            <img src="./images/image-product-1.jpg" alt="">    
            </figure>
            </div>
        </article>

        <!-- .desktop content  -->
        <article class="flex">
             <!-- information  -->
        <div class="sneaker-content">
         <p class="gray-color">SNEAKER COMPANY</p>
         <p class="bold">Fall Limited Edition <br> Sneakers</p>
         <p class="main-info">These low profile sneakers are your perfect <br>casual wear comparison. Featuring a durable <br>rubber outer sole, they'll withstand everything <br>the weather can offer.</p>
        </div>

        <!-- money discount section   -->
        <div class="discount">
            <div class="close">
            <p class="figures">$125.00</p>
            <p class="fifty">50%</p>
            </div>
            
            <div class="del">
            <del class="old-figures">$250.00</del>
            </div>
            
        </div>

        <!-- number and add to cart  -->

        <div class="display">
        <!-- numbers  -->
         <div class="numbers">
            <!-- operators  -->
            <div class="operators">
            
            <figure class="minus">
            <img src="./images/icon-minus.svg" alt="">
            </figure>

            <span class="zero">0</span>

            <figure class="plus">
            <img src="./images/icon-plus.svg" alt="">
            </figure>
            </div>

         </div>

        <!-- add to cart  -->
         <div class="add-to-cart">
            <!-- displaying content  -->
            <div class="content">
              <figure class="cart-image">
            <img src="./images/icon-cart.svg" alt="">
            </figure>

            <p class="text">Add to cart</p>
            </div>
          
         </div>

        </div>  

        </article>


     
      
        </article>

        </section>
    </main>


    <script src="index.js"></script>
</body>
</html>
